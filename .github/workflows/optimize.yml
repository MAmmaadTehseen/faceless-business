name: optimize
run-name: ${{ inputs.slot && format('optimize slot {0}', inputs.slot) || 'optimize' }}
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Internal: homelab scheduler slot id (duplicate guard)"
        required: false
        default: ""
jobs:
  guard:
    # One run per scheduled slot: the homelab server and GitHub cron both trigger; the second exits here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { actions: read, contents: read }
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: ops/homelab }
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: optimize.yml
          SLOT_INPUT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 ops/homelab/slot_guard.py
  optimize:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JARVIS_WEBHOOK_URL: ${{ secrets.JARVIS_WEBHOOK_URL }}
      JARVIS_WEBHOOK_SECRET: ${{ secrets.JARVIS_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
      LUNAROUTE_BASE_URL: ${{ vars.LUNAROUTE_BASE_URL || 'https://gw.lunaroute.com' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_TRADEWINDS: ${{ secrets.YT_REFRESH_TOKEN_TRADEWINDS }}
      YT_REFRESH_TOKEN_ESCAPEVELOCITY: ${{ secrets.YT_REFRESH_TOKEN_ESCAPEVELOCITY }}
      YT_REFRESH_TOKEN_TENTONGUES: ${{ secrets.YT_REFRESH_TOKEN_TENTONGUES }}
      META_ACCESS_TOKEN_FUTUREWORK: ${{ secrets.META_ACCESS_TOKEN_FUTUREWORK }}
      META_PAGE_ID_FUTUREWORK: ${{ secrets.META_PAGE_ID_FUTUREWORK }}
      META_IG_USER_ID_FUTUREWORK: ${{ secrets.META_IG_USER_ID_FUTUREWORK }}
      IG_ACCESS_TOKEN_FUTUREWORK: ${{ secrets.IG_ACCESS_TOKEN_FUTUREWORK }}
      META_ACCESS_TOKEN_TRADEWINDS: ${{ secrets.META_ACCESS_TOKEN_TRADEWINDS }}
      META_PAGE_ID_TRADEWINDS: ${{ secrets.META_PAGE_ID_TRADEWINDS }}
      META_IG_USER_ID_TRADEWINDS: ${{ secrets.META_IG_USER_ID_TRADEWINDS }}
      IG_ACCESS_TOKEN_TRADEWINDS: ${{ secrets.IG_ACCESS_TOKEN_TRADEWINDS }}
      META_ACCESS_TOKEN_ESCAPEVELOCITY: ${{ secrets.META_ACCESS_TOKEN_ESCAPEVELOCITY }}
      META_PAGE_ID_ESCAPEVELOCITY: ${{ secrets.META_PAGE_ID_ESCAPEVELOCITY }}
      META_IG_USER_ID_ESCAPEVELOCITY: ${{ secrets.META_IG_USER_ID_ESCAPEVELOCITY }}
      IG_ACCESS_TOKEN_ESCAPEVELOCITY: ${{ secrets.IG_ACCESS_TOKEN_ESCAPEVELOCITY }}
      META_ACCESS_TOKEN_TENTONGUES: ${{ secrets.META_ACCESS_TOKEN_TENTONGUES }}
      META_PAGE_ID_TENTONGUES: ${{ secrets.META_PAGE_ID_TENTONGUES }}
      META_IG_USER_ID_TENTONGUES: ${{ secrets.META_IG_USER_ID_TENTONGUES }}
      IG_ACCESS_TOKEN_TENTONGUES: ${{ secrets.IG_ACCESS_TOKEN_TENTONGUES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m pipeline.optimize
