name: words
run-name: words ${{ inputs.word || (inputs.slot && format('slot {0}', inputs.slot)) || github.run_id }}
on:
  schedule:
    - cron: "30 3 * * *"       # tentongues: daily 03:30 UTC; long publishes 07:00, Shorts 09:00-18:00
  workflow_dispatch:
    inputs:
      slot:
        description: "Internal: homelab scheduler slot id (duplicate guard)"
        required: false
        default: ""
      channel:
        description: "words-format channel key"
        default: tentongues
        required: false
      privacy:
        description: "private | public | unlisted (default: dashboard setting)"
        type: choice
        options: ["", private, public, unlisted]
        required: false
      word:
        description: "Force a word from channels/<key>/words.json"
        required: false
      resume_id:
        description: "Content id: re-render from the saved episode (restore artifact first)"
        required: false
      artifact_run_id:
        description: "Run id holding words-<channel>-<run_id> (for resume)"
        required: false
      bank:
        description: "Bank episodes to the Drive stockpile instead of publishing"
        type: boolean
        default: false
      count:
        description: "Bank mode: episodes to produce (parallel jobs, 3 at a time, max 20 per run)"
        default: "1"
        required: false
      provider:
        description: "LLM provider override for this run only (blank = Actions variable)"
        type: choice
        options: ["", anthropic, lunaroute]
        required: false
concurrency:
  # Bank runs are independent of the daily run and of each other (words are claimed under a DB lock).
  group: words-${{ github.event.inputs.channel || 'tentongues' }}${{ inputs.bank && format('-bank-{0}', github.run_id) || '' }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  guard:
    # One run per scheduled slot: the homelab server and GitHub cron both trigger; the second exits here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { actions: read, contents: read }
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: ops/homelab }
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: words.yml
          SLOT_INPUT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 ops/homelab/slot_guard.py
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - id: plan
        env:
          BANK: ${{ inputs.bank }}
          COUNT: ${{ inputs.count }}
        run: |
          n=1
          if [ "$BANK" = "true" ]; then
            [[ "$COUNT" =~ ^[0-9]+$ ]] || { echo "count must be a number" >&2; exit 1; }
            n=$(( COUNT < 1 ? 1 : COUNT > 20 ? 20 : COUNT ))
          fi
          echo "jobs=$(python3 -c "import json,sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))" "$n")" >> "$GITHUB_OUTPUT"
  words:
    needs: [guard, plan]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      JARVIS_WEBHOOK_URL: ${{ secrets.JARVIS_WEBHOOK_URL }}
      JARVIS_WEBHOOK_SECRET: ${{ secrets.JARVIS_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ inputs.provider || vars.LLM_PROVIDER || 'anthropic' }}
      LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
      LUNAROUTE_BASE_URL: ${{ vars.LUNAROUTE_BASE_URL || 'https://gw.lunaroute.com' }}
      # GLM thinks to max_tokens on long structured prompts unless capped (recap uses the same cap).
      LUNAROUTE_THINKING_BUDGET: ${{ inputs.provider == 'lunaroute' && '3000' || '' }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_TENTONGUES: ${{ secrets.YT_REFRESH_TOKEN_TENTONGUES }}
      META_ACCESS_TOKEN_TENTONGUES: ${{ secrets.META_ACCESS_TOKEN_TENTONGUES }}
      META_PAGE_ID_TENTONGUES: ${{ secrets.META_PAGE_ID_TENTONGUES }}
      META_IG_USER_ID_TENTONGUES: ${{ secrets.META_IG_USER_ID_TENTONGUES }}
      IG_ACCESS_TOKEN_TENTONGUES: ${{ secrets.IG_ACCESS_TOKEN_TENTONGUES }}
      GH_TOKEN: ${{ github.token }}
      TTS_BACKEND: kokoro
      HF_HOME: ${{ github.workspace }}/.hf
      PIPER_VOICES_DIR: ${{ github.workspace }}/.piper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System packages (ffmpeg, espeak-ng, Noto fonts for every script)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg fonts-dejavu-core espeak-ng libfribidi0 \
              fonts-noto-core fonts-noto-cjk fonts-noto-extra && break
            echo "apt retry $i"; sleep 30
          done
          command -v ffmpeg
          fc-list | grep -ciE "NotoSansDevanagari|NotoNastaliqUrdu|NotoSansCJK" || { echo "Noto fonts missing" >&2; exit 1; }
      - name: Install dependencies (CPU torch, Kokoro with ja/zh extras, Piper)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile "misaki[zh]" piper-tts fugashi jaconv mojimoji unidic-lite pyopenjtalk-plus
      - name: Cache Kokoro model and Piper voices
        uses: actions/cache@v4
        with:
          path: |
            .hf
            .piper
          key: tts-words-v1
      - name: Restore saved episode
        if: github.event.inputs.resume_id != ''
        env:
          RESUME_ID: ${{ github.event.inputs.resume_id }}
          ARTIFACT_RUN_ID: ${{ github.event.inputs.artifact_run_id }}
          CHANNEL: ${{ github.event.inputs.channel || 'tentongues' }}
        run: |
          [[ "$RESUME_ID" =~ ^[a-z]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]] || { echo "Invalid resume_id" >&2; exit 1; }
          # Without an artifact (expired after 3 days) the episode checkpoint in content.qa_notes is used.
          if [ -z "$ARTIFACT_RUN_ID" ]; then echo "No artifact; resuming from the database checkpoint"; exit 0; fi
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "artifact_run_id must be numeric" >&2; exit 1; }
          gh run download "$ARTIFACT_RUN_ID" -n "words-$CHANNEL-$ARTIFACT_RUN_ID" -D .
          if [ ! -d "out/$RESUME_ID" ] && [ -d "$RESUME_ID" ]; then mkdir -p out; mv -- "$RESUME_ID" "out/$RESUME_ID"; fi
      - name: Produce the episode and ten Shorts
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'tentongues' }}
          PRIVACY: ${{ github.event.inputs.privacy }}
          WORD: ${{ github.event.inputs.word }}
          RESUME_ID: ${{ github.event.inputs.resume_id }}
          BANK: ${{ inputs.bank }}
        run: |
          case "$CHANNEL" in tentongues) ;; *) echo "Unknown words channel: $CHANNEL" >&2; exit 1 ;; esac
          ARGS=(--channel "$CHANNEL" --publish)
          if [ "$BANK" = "true" ]; then ARGS=(--channel "$CHANNEL" --bank); fi
          if [ -n "$PRIVACY" ]; then ARGS+=(--privacy "$PRIVACY"); fi
          if [ -n "$WORD" ]; then ARGS+=(--word "$WORD"); fi
          if [ -n "$RESUME_ID" ]; then ARGS+=(--resume "$RESUME_ID"); fi
          python -m pipeline.words "${ARGS[@]}"
      - name: Keep rendered files for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: words-${{ github.event.inputs.channel || 'tentongues' }}-${{ github.run_id }}${{ inputs.bank && format('-{0}', matrix.n) || '' }}
          path: |
            out/**/*.mp4
            out/**/*.jpg
            out/**/episode.json
            out/**/result.json
            out/**/voice.mp3
            out/**/*.srt
          retention-days: 3
          if-no-files-found: ignore
