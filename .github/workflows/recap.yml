name: recap
# Cloud film recaps: films + <film>.rights.json in Google Drive "Faceless Recap/inbox" (up to five accounts)
# are produced here and written to "review"; folders moved to "approve" are uploaded to YouTube.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "produce (inbox films), upload (approved folders), both, scan, regenerate (one piece)"
        type: choice
        options: [both, produce, upload, scan, regenerate]
        default: both
      limit:
        description: "Films to produce in this run (each takes roughly 4-6 hours)"
        type: number
        default: 1
      project:
        description: "regenerate: project id (the id in the folder's state.json)"
        type: string
        default: ""
      piece:
        description: "regenerate: piece to re-make"
        type: choice
        options: [short1, short2, short3, short4, long]
        default: short1
      parallel:
        description: "produce: batch mode, this many parallel jobs (max 4 at once, up to 40); each claims its own films and never uploads"
        type: number
        default: 1
      provider:
        description: "LLM provider override for this run only (blank = Actions variable)"
        type: choice
        options: ["", anthropic, lunaroute]
        default: ""
# contents: write lets large queued media (>45 MB) be checkpointed as release assets before upload, like shorts.yml.
permissions:
  contents: write
concurrency:
  # Batch runs are separate from the scheduled run; films are claimed per job in the database.
  group: recap${{ inputs.parallel > 1 && format('-batch-{0}', github.run_id) || '' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - id: plan
        env:
          PARALLEL: ${{ inputs.parallel }}
        run: |
          n=${PARALLEL:-1}
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          n=$(( n < 1 ? 1 : n > 40 ? 40 : n ))
          echo "jobs=$(python3 -c "import json,sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))" "$n")" >> "$GITHUB_OUTPUT"
  recap:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      PYTHON_DOTENV_DISABLED: "1"
      LLM_PROVIDER: ${{ inputs.provider || vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
      LUNAROUTE_BASE_URL: ${{ vars.LUNAROUTE_BASE_URL || 'https://gw.lunaroute.com' }}
      LUNAROUTE_THINKING_BUDGET: ${{ vars.LUNAROUTE_THINKING_BUDGET || '3000' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_FILMREVIEW: ${{ secrets.YT_REFRESH_TOKEN_FILMREVIEW }}
      META_ACCESS_TOKEN_FILMREVIEW: ${{ secrets.META_ACCESS_TOKEN_FILMREVIEW }}
      META_PAGE_ID_FILMREVIEW: ${{ secrets.META_PAGE_ID_FILMREVIEW }}
      META_IG_USER_ID_FILMREVIEW: ${{ secrets.META_IG_USER_ID_FILMREVIEW }}
      IG_ACCESS_TOKEN_FILMREVIEW: ${{ secrets.IG_ACCESS_TOKEN_FILMREVIEW }}
      GDRIVE_RECAP_REFRESH_TOKEN_1: ${{ secrets.GDRIVE_RECAP_REFRESH_TOKEN_1 }}
      GDRIVE_RECAP_REFRESH_TOKEN_2: ${{ secrets.GDRIVE_RECAP_REFRESH_TOKEN_2 }}
      GDRIVE_RECAP_REFRESH_TOKEN_3: ${{ secrets.GDRIVE_RECAP_REFRESH_TOKEN_3 }}
      GDRIVE_RECAP_REFRESH_TOKEN_4: ${{ secrets.GDRIVE_RECAP_REFRESH_TOKEN_4 }}
      GDRIVE_RECAP_REFRESH_TOKEN_5: ${{ secrets.GDRIVE_RECAP_REFRESH_TOKEN_5 }}
      GH_TOKEN: ${{ github.token }}
      TTS_BACKEND: kokoro
      RECAP_WHISPER_MODEL: ${{ vars.RECAP_WHISPER_MODEL || 'small' }}
      HF_HOME: ${{ github.workspace }}/.hf
      GATED: ${{ github.event_name == 'schedule' && '--gated' || '' }}
      BATCH: ${{ inputs.parallel > 1 && '--no-upload' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg fonts-dejavu-core espeak-ng && break; echo "apt retry $i"; sleep 30; done; command -v ffmpeg
      - name: Install dependencies (CPU torch, then Kokoro and faster-whisper)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile faster-whisper
      - name: Cache Kokoro and Whisper models
        uses: actions/cache@v4
        with:
          path: .hf
          key: recap-models-v1
      - name: Reels and Page posts for recaps that went public
        if: (inputs.action == 'both' || inputs.action == 'upload' || github.event_name == 'schedule') && !(inputs.parallel > 1)
        run: python -m pipeline.recap.cloud social $GATED
      - name: Upload approved folders
        if: (inputs.action == 'both' || inputs.action == 'upload' || github.event_name == 'schedule') && !(inputs.parallel > 1)
        run: python -m pipeline.recap.cloud upload $GATED
      - name: Scan inboxes
        if: inputs.action == 'scan'
        run: python -m pipeline.recap.cloud scan
      - name: Produce inbox films
        if: inputs.action == 'both' || inputs.action == 'produce' || github.event_name == 'schedule'
        run: python -m pipeline.recap.cloud produce --limit "${{ inputs.limit || 1 }}" --claim $GATED $BATCH
      - name: Regenerate one piece
        if: inputs.action == 'regenerate'
        run: python -m pipeline.recap.cloud regenerate --project "${{ inputs.project }}" --piece "${{ inputs.piece }}"
