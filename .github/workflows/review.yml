name: weekly-review
on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pipeline.review
      - run: |
          git config user.name "pipeline-bot" && git config user.email "bot@users.noreply.github.com"
          git add channels && (git diff --cached --quiet || (git commit -m "persona: weekly review" && git push))
