name: produce
on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC = 11:00 PKT
    - cron: "0 18 * * *"   # 18:00 UTC = 23:00 PKT
  workflow_dispatch:
    inputs:
      privacy:
        description: "private | public | unlisted (default: dashboard setting)"
        required: false
      count:
        description: "long videos this run"
        required: false
        default: "1"
concurrency: produce
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Produce and publish
        run: |
          ARGS="--publish --count ${{ github.event.inputs.count || '1' }}"
          if [ -n "${{ github.event.inputs.privacy }}" ]; then ARGS="$ARGS --privacy ${{ github.event.inputs.privacy }}"; fi
          python -m pipeline.run_all $ARGS
      - name: Keep the rendered files for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/*.jpg
            out/**/script.json
            out/**/result.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Persist persona learnings
        if: always()
        run: |
          git config user.name "pipeline-bot" && git config user.email "bot@users.noreply.github.com"
          git add persona || true
          git diff --cached --quiet || (git commit -m "persona: automated update" && git push)
