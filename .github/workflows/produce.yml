name: produce
on:
  schedule:
    - cron: "0 6 * * 1,3,5"     # futurework: Mon/Wed/Fri 06:00 UTC (11:00 PKT)
    - cron: "0 11 * * 2,4,6"    # tradewinds: Tue/Thu/Sat 11:00 UTC (16:00 PKT)
    - cron: "0 16 * * 1,4,0"    # escapevelocity: Mon/Thu/Sun 16:00 UTC (21:00 PKT)
  workflow_dispatch:
    inputs:
      channel:
        description: "futurework | tradewinds | escapevelocity"
        required: true
        default: "futurework"
      privacy:
        description: "private | public | unlisted (default: dashboard setting)"
        required: false
      count:
        description: "long videos this run"
        required: false
        default: "1"
concurrency:
  group: produce-${{ github.event.inputs.channel || github.event.schedule }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_TRADEWINDS: ${{ secrets.YT_REFRESH_TOKEN_TRADEWINDS }}
      YT_REFRESH_TOKEN_ESCAPEVELOCITY: ${{ secrets.YT_REFRESH_TOKEN_ESCAPEVELOCITY }}
      META_ACCESS_TOKEN_FUTUREWORK: ${{ secrets.META_ACCESS_TOKEN_FUTUREWORK }}
      META_PAGE_ID_FUTUREWORK: ${{ secrets.META_PAGE_ID_FUTUREWORK }}
      META_IG_USER_ID_FUTUREWORK: ${{ secrets.META_IG_USER_ID_FUTUREWORK }}
      IG_ACCESS_TOKEN_FUTUREWORK: ${{ secrets.IG_ACCESS_TOKEN_FUTUREWORK }}
      META_ACCESS_TOKEN_TRADEWINDS: ${{ secrets.META_ACCESS_TOKEN_TRADEWINDS }}
      META_PAGE_ID_TRADEWINDS: ${{ secrets.META_PAGE_ID_TRADEWINDS }}
      META_IG_USER_ID_TRADEWINDS: ${{ secrets.META_IG_USER_ID_TRADEWINDS }}
      IG_ACCESS_TOKEN_TRADEWINDS: ${{ secrets.IG_ACCESS_TOKEN_TRADEWINDS }}
      META_ACCESS_TOKEN_ESCAPEVELOCITY: ${{ secrets.META_ACCESS_TOKEN_ESCAPEVELOCITY }}
      META_PAGE_ID_ESCAPEVELOCITY: ${{ secrets.META_PAGE_ID_ESCAPEVELOCITY }}
      META_IG_USER_ID_ESCAPEVELOCITY: ${{ secrets.META_IG_USER_ID_ESCAPEVELOCITY }}
      IG_ACCESS_TOKEN_ESCAPEVELOCITY: ${{ secrets.IG_ACCESS_TOKEN_ESCAPEVELOCITY }}
      GH_TOKEN: ${{ github.token }}
      TTS_BACKEND: kokoro
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
      - name: Install dependencies (CPU torch, then Kokoro)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: .hf
          key: kokoro-82m-v1
      - name: Pick channel
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1,3,5")  CH=futurework ;;
            "0 11 * * 2,4,6") CH=tradewinds ;;
            "0 16 * * 1,4,0") CH=escapevelocity ;;
            *) CH="${{ github.event.inputs.channel || 'futurework' }}" ;;
          esac
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "channel: $CH"
      - name: Produce and publish
        run: |
          ARGS="--publish --channel ${{ steps.pick.outputs.channel }} --count ${{ github.event.inputs.count || '1' }}"
          if [ -n "${{ github.event.inputs.privacy }}" ]; then ARGS="$ARGS --privacy ${{ github.event.inputs.privacy }}"; fi
          python -m pipeline.run_all $ARGS
      - name: Keep the rendered files for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.pick.outputs.channel }}-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/*.jpg
            out/**/script.json
            out/**/result.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Persist persona learnings
        if: always()
        run: |
          git config user.name "pipeline-bot" && git config user.email "bot@users.noreply.github.com"
          git add channels || true
          git diff --cached --quiet || (git commit -m "persona: automated update" && git pull --rebase && git push)
